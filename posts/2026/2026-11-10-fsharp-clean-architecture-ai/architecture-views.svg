<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" style="max-width:100%;height:auto" role="img" aria-labelledby="title description">
  <title id="title">Clean/onion architecture and functional core: two views of one application</title>
  <desc id="description">On the left, peer adapters WebApi and Infrastructure surround Services and its contracts, which surround pure Model rules. Source-code dependencies point inward. On the right, the imperative shell reads inputs, calls a pure functional core, and performs effects. This is an execution flow, not a dependency diagram.</desc>
  <defs>
    <marker id="dependency-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#862e9c"/>
    </marker>
    <marker id="flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#495057"/>
    </marker>
  </defs>
  <rect width="1000" height="580" rx="16" fill="#ffffff"/>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#000000" text-anchor="middle">
    <text x="500" y="44" font-size="26" font-weight="700">Same application. Two architectural views.</text>
    <text x="250" y="98" font-size="23" font-weight="600">Clean / onion architecture</text>
    <text x="750" y="98" font-size="23" font-weight="600">Functional core / imperative shell</text>
    <rect x="30" y="135" width="440" height="340" rx="24" fill="none" stroke="#1864ab" stroke-width="2"/>
    <text x="250" y="177" font-size="20">Adapters: WebApi + Infrastructure</text>
    <rect x="75" y="215" width="350" height="220" rx="20" fill="none" stroke="#862e9c" stroke-width="2"/>
    <text x="250" y="257" font-size="20">Services: use cases + contracts</text>
    <rect x="130" y="300" width="240" height="100" rx="16" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
    <text x="250" y="341" font-size="22" font-weight="600">Model</text>
    <text x="250" y="373" font-size="19">Pure domain rules</text>
    <path d="M 42 350 H 120" stroke="#862e9c" stroke-width="3" marker-end="url(#dependency-arrow)" fill="none"/>
    <text x="250" y="515" font-size="19">Source-code dependencies point inward.</text>
    <rect x="530" y="135" width="440" height="340" rx="24" fill="none" stroke="#1864ab" stroke-width="2"/>
    <text x="750" y="177" font-size="20">Imperative shell</text>
    <text x="750" y="214" font-size="19">Read inputs: storage, clock, requests</text>
    <path d="M 750 225 V 250" stroke="#495057" stroke-width="2" marker-end="url(#flow-arrow)" fill="none"/>
    <rect x="590" y="260" width="320" height="100" rx="16" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
    <text x="750" y="301" font-size="22" font-weight="600">Functional core: Model</text>
    <text x="750" y="333" font-size="19">Facts in. Decisions out. No I/O.</text>
    <path d="M 750 370 V 395" stroke="#495057" stroke-width="2" marker-end="url(#flow-arrow)" fill="none"/>
    <text x="750" y="430" font-size="19">Perform effects: save, publish, respond</text>
    <text x="750" y="515" font-size="19">Execution flow: read, decide, act.</text>
    <text x="500" y="558" font-size="18">The green Model is the same pure core in both views. Composition wires the adapters.</text>
  </g>
</svg>
